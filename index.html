<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>image-diff</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#111;color:#ddd;font:13px system-ui}
header{display:flex;gap:12px;align-items:center;padding:6px 10px}
#g{flex:1;display:grid;gap:1px;background:#444;touch-action:none;--a:.7}
#g:empty::after{content:"drop images · double-click sets reference";margin:auto;place-self:center}
.f{position:relative;overflow:hidden;background:#000}.r{outline:2px solid #fc0;outline-offset:-2px}
.v{position:absolute;transform:var(--t);transform-origin:0 0}
canvas{position:absolute;image-rendering:pixelated}.o{opacity:var(--a)}#g.n .o{display:none}
span{position:absolute;left:4px;bottom:4px;background:#000a;padding:2px 4px;pointer-events:none}
</style>
<header><input type=file id=fi multiple accept=image/*>
<label><input type=checkbox id=on checked> diff</label>
<label>tolerance <input type=range id=tol min=1 max=441 value=1> <b id=tv>1</b></label>
<label>opacity <input type=range id=op min=0 max=1 step=.05 value=.7></label>
<a href=https://github.com/jacksongoode/image-diff style=color:#888;margin-left:auto>src</a></header>
<main id=g></main>
<script type=module>
const E=(await WebAssembly.instantiateStreaming(fetch('diff.wasm'))).instance.exports,B=E.memory.buffer.byteLength;
let W,H,P,ims=[],ref=0,v;
const draw=()=>g.style.setProperty('--t',`translate(${v.x}px,${v.y}px) scale(${v.s})`);
function fit(){const r=g.firstChild.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);v={s,x:(r.width-W*s)/2,y:(r.height-H*s)/2};draw()}
function diff(){
  const t=+tol.value,o=B+ims.length*P;tv.textContent=t;
  ims.forEach((m,i)=>{
    m.f.classList.toggle('r',i==ref);m.o.hidden=i==ref;
    if(i==ref)return m.l.textContent=m.name+' · reference';
    const n=E.diff(B+ref*P,B+i*P,o,P>>4,t*t),mse=E.sse()/(3*W*H);
    m.o.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(E.memory.buffer,o,W*H*4),W),0,0);
    m.l.textContent=`${m.name} · PSNR ${mse?(10*Math.log10(65025/mse)).toFixed(2)+' dB':'∞'} · ${(100*n/W/H).toFixed(2)}% differ`;
  });
}
async function load(fs){
  fs=[...fs].filter(f=>f.type.startsWith('image/')).sort((a,b)=>a.name.localeCompare(b.name,0,{numeric:1}));
  if(!fs.length)return;
  const b0=await createImageBitmap(fs[0]);W=b0.width;H=b0.height;P=(W*H+3&~3)*4;ref=0;
  const bs=[b0,...await Promise.all(fs.slice(1).map(f=>createImageBitmap(f,{resizeWidth:W,resizeHeight:H,resizeQuality:'high'})))];
  const need=B+(bs.length+1)*P-E.memory.buffer.byteLength;if(need>0)E.memory.grow(Math.ceil(need/65536));
  const cx=new OffscreenCanvas(W,H).getContext('2d',{willReadFrequently:true});
  g.innerHTML='';g.style.gridTemplateColumns=`repeat(${Math.ceil(Math.sqrt(bs.length))},1fr)`;
  ims=bs.map((b,i)=>{
    cx.clearRect(0,0,W,H);cx.drawImage(b,0,0);
    const m=new Uint8Array(E.memory.buffer,B+i*P,P);m.fill(0,W*H*4);m.set(cx.getImageData(0,0,W,H).data);
    const f=document.createElement('div');f.className='f';
    f.innerHTML='<div class=v><canvas></canvas><canvas class=o></canvas></div><span></span>';
    const [c,o]=f.querySelectorAll('canvas');c.width=o.width=W;c.height=o.height=H;c.getContext('2d').drawImage(b,0,0);
    f.ondblclick=()=>{ref=i;diff()};g.append(f);
    return {f,o,l:f.lastChild,name:fs[i].name};
  });
  fit();diff();
}
fi.onchange=()=>load(fi.files);
ondragover=e=>e.preventDefault();ondrop=e=>{e.preventDefault();load(e.dataTransfer.files)};
onresize=()=>ims.length&&fit();
tol.oninput=diff;op.oninput=()=>g.style.setProperty('--a',op.value);on.onchange=()=>g.classList.toggle('n',!on.checked);
g.onwheel=e=>{const f=e.target.closest('.f');if(!f)return;e.preventDefault();
  const r=f.getBoundingClientRect(),k=Math.exp(-e.deltaY/300),x=e.clientX-r.left,y=e.clientY-r.top;
  v.x=x-(x-v.x)*k;v.y=y-(y-v.y)*k;v.s*=k;draw()};
g.onpointerdown=e=>{if(!v)return;let x=e.clientX,y=e.clientY;g.setPointerCapture(e.pointerId);
  g.onpointermove=e=>{v.x+=e.clientX-x;v.y+=e.clientY-y;x=e.clientX;y=e.clientY;draw()}};
g.onpointerup=()=>g.onpointermove=null;
</script>
