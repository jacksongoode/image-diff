<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>image diff</title>
<style>
  :root {
    --bg: #0f0f10;
    --fg: #86857f;
    --muted: #807f79;
    --hi: #e9e4da;
    --accent: #d9a19c;
    --line: #242426;
    --line-hover: #3b3b3e;
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 12px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
  }
  header, footer { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; padding: 16px 22px; }
  footer { min-height: 30px; }
  h1 { margin: 0 auto 0 0; font: inherit; color: var(--hi); }
  nav { display: flex; gap: 14px; }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
  button, label { cursor: pointer; user-select: none; transition: color .25s, opacity .25s; }
  button:hover, label:hover, [aria-pressed=true] { color: var(--hi); }
  :focus-visible, label:has(#files:focus-visible) { outline: 1px solid var(--accent); outline-offset: 3px; }
  [inert] { opacity: .25; }
  output { display: inline-block; min-width: 4ch; text-align: center; color: var(--hi); }
  input[type=range] { width: 84px; vertical-align: middle; accent-color: var(--accent); }
  #files { position: absolute; width: 0; opacity: 0; }
  #cols button { padding: 0 4px; }

  main { flex: 1; position: relative; min-height: 0; margin: 0 14px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--bg); touch-action: none; cursor: grab; }
  #labels div {
    position: absolute;
    padding: 8px 10px;
    font-size: 11px;
    color: var(--hi);
    opacity: .75;
    text-shadow: 0 0 8px #000;
    white-space: nowrap;
    pointer-events: none;
  }
  #empty {
    position: absolute;
    inset: 8px;
    display: grid;
    place-content: center;
    border: 1px dashed var(--line);
    transition: color .25s, border-color .25s;
  }
  #empty:hover { color: var(--hi); border-color: var(--line-hover); }
  #empty[hidden] { display: none; }

  #chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #chips span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px 6px 9px;
    border: 1px solid var(--line);
    cursor: grab;
    user-select: none;
    transition: color .25s, border-color .25s;
  }
  #chips span:hover { color: var(--hi); border-color: var(--line-hover); }
  #chips span[aria-pressed=true] { color: var(--hi); border-color: var(--accent); }
  #chips span.ghost { opacity: .3; }
  #chips i { width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; transition: background .25s, border-color .25s, transform .25s; }
  #chips span:hover i { border-color: var(--accent); }
  #chips [aria-pressed=true] i { background: var(--accent); border-color: var(--accent); transform: scale(1.15); }
  #chips u { text-decoration: none; color: var(--muted); font-variant-numeric: tabular-nums; }
  #chips em { font-style: normal; color: var(--muted); }
</style>

<header>
  <h1>image diff</h1>
  <nav id="modes" aria-label="view">
    <button data-mode="0" aria-pressed="true">tile</button>
    <button data-mode="1" aria-pressed="false">overlay</button>
    <button data-mode="2" aria-pressed="false">spread</button>
  </nav>
  <span id="cols">
    cols
    <button id="cols-less" aria-label="fewer columns">−</button><output id="cols-value" aria-live="polite">auto</output><button id="cols-more" aria-label="more columns">+</button>
  </span>
  <button id="diff" aria-pressed="true">diff</button>
  <label>tolerance <input type="range" id="tolerance" min="1" max="441" value="8"> <output id="tolerance-value">8</output></label>
  <label>tint <input type="range" id="tint" min="0" max="1" step=".05" value=".75"></label>
  <label>add images<input type="file" id="files" multiple accept="image/*"></label>
</header>

<main>
  <canvas id="canvas" role="img" aria-label="image comparison"></canvas>
  <div id="labels"></div>
  <label id="empty" for="files">Drop or choose images</label>
</main>

<footer>
  <div id="chips" role="group" aria-label="images"></div>
</footer>

<script type="module" src="main.ts"></script>
