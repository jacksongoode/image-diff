<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>image diff</title>
<style>
  :root { --bg: #0f0f10; --fg: #86857f; --hi: #e9e4da; --ac: #d9a19c; --ln: #242426; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 12px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .01em; -webkit-font-smoothing: antialiased; }
  header, footer { display: flex; gap: 22px; align-items: center; padding: 16px 22px; flex-wrap: wrap; }
  footer { gap: 8px; min-height: 30px; }
  a, label, footer span { cursor: pointer; user-select: none; transition: color .25s, border-color .25s, opacity .25s; }
  a:hover, label:hover, .on { color: var(--hi); }
  i { font-style: normal; color: var(--hi); margin-right: auto; }
  nav { display: flex; gap: 14px; }
  b { font-weight: 400; color: var(--hi); display: inline-block; min-width: 4ch; text-align: center; }
  input[type=range] { width: 84px; accent-color: var(--ac); vertical-align: middle; }
  #colc a { padding: 0 4px; }
  .off { opacity: .25; pointer-events: none; }
  main { flex: 1; position: relative; margin: 0 14px; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #lab div { position: absolute; pointer-events: none; color: var(--hi); opacity: .75; padding: 8px 10px; font-size: 11px; text-shadow: 0 0 8px #000; white-space: nowrap; }
  #empty { position: absolute; inset: 8px; margin: 0; display: grid; place-content: center; text-align: center; border: 1px dashed var(--ln); line-height: 2; pointer-events: none; }
  #empty[hidden] { display: none; }
  #empty small { color: #55544f; }
  footer span { border: 1px solid var(--ln); padding: 6px 10px; cursor: grab; }
  footer span.ref { border-color: var(--ac); color: var(--hi); }
  footer em { font-style: normal; color: #5c5b56; margin-left: 8px; }
</style>
<header>
  <i>image diff</i>
  <nav id="modes"><a data-m="0" class="on">tile</a><a data-m="1">overlay</a><a data-m="2">spread</a></nav>
  <span id="colc">cols <a id="cm">−</a><b id="cn">auto</b><a id="cp">+</a></span>
  <a id="dt" class="on">diff</a>
  <label>tolerance <input type="range" id="tol" min="1" max="441" value="8"> <b id="tv">8</b></label>
  <label>tint <input type="range" id="al" min="0" max="1" step=".05" value=".75"></label>
  <label>add images<input type="file" id="fi" multiple accept="image/*" hidden></label>
</header>
<main>
  <canvas id="c"></canvas>
  <div id="lab"></div>
  <p id="empty">drop up to eight images<br><small>drag to pan · scroll to zoom · 1–8 solo · t o s views · f fit · d diff</small></p>
</main>
<footer id="chips"></footer>
<script type="module" src="main.ts"></script>
